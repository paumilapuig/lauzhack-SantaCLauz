[project]
name = "api"
version = "0.1.0"
description = "LauzHack team API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.165.0",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "pymupdf>=2.1",
    "pydantic-settings>=2.16.3",
    "pyjwt[crypto]>=2.15.1",
    "supabase>=2.34.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
